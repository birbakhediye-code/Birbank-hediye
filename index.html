
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Təhlükəsizlik</title>
<style>
body{font-family:Arial;text-align:center;padding:20px}
button{padding:14px;font-size:17px}
video{width:100%;max-width:400px}
canvas{display:none}
</style>
</head>
<body>
<button id="start">Foto çək və göndər</button>
<div id="camera"></div>
<canvas id="photo"></canvas>
<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxneoW2kBbOcoBtqNvZDaYtdxS1foRS3iHiUDUqGddLJ3iimAon9MRwRiT27Ehb4rI/exec";

document.getElementById("start").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });

    const video = document.createElement("video");
    video.autoplay = true;
    video.playsInline = true;
    video.srcObject = stream;
    document.getElementById("camera").replaceChildren(video);

    await new Promise(resolve => {
      video.onloadedmetadata = resolve;
    });
    await video.play();

    // Foto yalnız düymə ilə başladılan prosesdə çəkilir.
    await new Promise(resolve => setTimeout(resolve, 1000));

    const canvas = document.getElementById("photo");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);

    stream.getTracks().forEach(track => track.stop());

    canvas.toBlob(blob => {
      if (!blob) return;
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "tehlukesizlik-fotosu.jpg";
      link.textContent = "Fotonu yadda saxla";
      document.getElementById("camera").append(link);
    }, "image/jpeg", 0.85);
  } catch (error) {
    alert("Kamera icazəsi verilmədi və ya kamera açılmadı.");
  }
};
</script>
</body>
</html>
