<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Təhlükəsizlik</title>
<style>
body {
  margin: 0;
  padding: 16px;
  font-family: Arial, sans-serif;
  text-align: center;
  background: white;
}
video {
  width: 100%;
  max-width: 420px;
}
button {
  padding: 12px 24px;
  font-size: 17px;
  margin: 10px;
}
</style>
</head>
<body>

<video id="camera" autoplay playsinline hidden></video>
<div id="status"></div>
<button id="ok" hidden>OK — foto çək və göndər</button>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxneoW2kBbOcoBtqNvZDaYtdxS1foRS3iHiUDUqGddLJ3iimAon9MRwRiT27Ehb4rI/exec";

const video = document.getElementById("camera");
const button = document.getElementById("ok");
const status = document.getElementById("status");

let stream;

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });

    video.srcObject = stream;
    video.hidden = false;
    await video.play();

    button.hidden = false;
    status.textContent = "Ön kamera açıldı.";
  } catch (error) {
    status.textContent =
      "Kamera açılmadı. Brauzerdə kamera icazəsini yoxla.";
  }
}

button.addEventListener("click", async () => {
  button.disabled = true;
  status.textContent = "Foto hazırlanır...";

  try {
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    canvas.getContext("2d").drawImage(
      video, 0, 0, canvas.width, canvas.height
    );

    stream.getTracks().forEach(track => track.stop());
    video.hidden = true;

    const image = canvas.toDataURL("image/jpeg", 0.75);

    status.textContent = "Foto göndərilir...";

    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        type: "photo",
        confirmed: true,
        image: image
      })
    });

    status.textContent =
      "Göndərmə sorğusu tamamlandı. Gmail-i yoxla.";
  } catch (error) {
    status.textContent =
      "Göndərmək mümkün olmadı. İnternet bağlantısını yoxla.";
  }
});

startCamera();
</script>

</body>
</html>
