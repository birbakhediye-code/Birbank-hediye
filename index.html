<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foto çək</title>
<style>
body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  text-align: center;
  background: white;
}
button {
  padding: 14px 20px;
  font-size: 17px;
  margin: 10px;
}
video {
  width: 100%;
  max-width: 400px;
  margin-top: 15px;
}
canvas {
  display: none;
}
</style>
</head>
<body>

<button id="start">Ön kameranı aç</button>
<button id="capture" hidden>Foto çək</button>

<div id="camera"></div>
<div id="result"></div>
<canvas id="photo"></canvas>

<script>
let stream;
let video;

const startButton = document.getElementById("start");
const captureButton = document.getElementById("capture");
const camera = document.getElementById("camera");
const result = document.getElementById("result");
const canvas = document.getElementById("photo");

startButton.addEventListener("click", async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });

    video = document.createElement("video");
    video.autoplay = true;
    video.playsInline = true;
    video.srcObject = stream;

    camera.replaceChildren(video);
    await video.play();

    startButton.hidden = true;
    captureButton.hidden = false;
    result.textContent = "";
  } catch (error) {
    alert("Ön kamera açılmadı. Kamera icazəsini yoxla.");
  }
});

captureButton.addEventListener("click", () => {
  if (!video || !video.videoWidth) return;

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  canvas.getContext("2d").drawImage(
    video, 0, 0, canvas.width, canvas.height
  );

  stream.getTracks().forEach(track => track.stop());
  camera.replaceChildren();

  canvas.toBlob(blob => {
    if (!blob) {
      result.textContent = "Foto hazırlana bilmədi.";
      return;
    }

    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "foto.jpg";
    link.textContent = "Fotonu telefona yadda saxla";
    result.replaceChildren(link);
  }, "image/jpeg", 0.9);

  captureButton.hidden = true;
});
</script>

</body>
</html>
