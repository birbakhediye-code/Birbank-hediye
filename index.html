<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Təhlükəsizlik</title>
<style>
body {
  margin: 0;
  padding: 12px;
  background: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
video {
  width: 100%;
  max-width: 420px;
}
button {
  padding: 12px 24px;
  font-size: 18px;
  margin: 12px;
}
</style>
</head>
<body>

<video id="camera" autoplay playsinline hidden></video>
<button id="ok" hidden>OK — foto çək və göndər</button>
<p id="status"></p>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxfAoXo4RMLITQJQF8c8NaaQdJ-6VY_wL6Vy0unfou252ohl0_nbo8YCuAEGm1zoHIu/exec";

const camera = document.getElementById("camera");
const ok = document.getElementById("ok");
const status = document.getElementById("status");
let stream;

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });

    camera.srcObject = stream;
    camera.hidden = false;
    await camera.play();
    ok.hidden = false;
  } catch (e) {
    status.textContent =
      "Kamera açılmadı. Kamera icazəsini yoxla.";
  }
}

ok.addEventListener("click", async () => {
  if (!camera.videoWidth) return;

  ok.disabled = true;
  status.textContent = "Foto hazırlanır...";

  try {
    const canvas = document.createElement("canvas");
    canvas.width = camera.videoWidth;
    canvas.height = camera.videoHeight;

    canvas.getContext("2d").drawImage(
      camera, 0, 0, canvas.width, canvas.height
    );

    stream.getTracks().forEach(track => track.stop());
    camera.hidden = true;

    const image = canvas.toDataURL("image/jpeg", 0.75);

    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        type: "photo",
        confirmed: true,
        image: image
      })
    });

    status.textContent =
      "Sorğu göndərildi. Gmail-də məktubu yoxla.";
  } catch (e) {
    status.textContent =
      "Göndərmə xətası. İnternet bağlantısını yoxla.";
    ok.disabled = false;
  }
});

startCamera();
</script>
</body>
</html>
